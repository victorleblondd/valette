- date: "2026-09-18"
  heure: "13:07"
  type: alerte
  theme: eau
  titre: "Sécheresse : arrêté préfectoral limitant les usages de l'eau"
  resume: "L'arrêté préfectoral n° 2026-199-DDT du 17 septembre 2026 limite provisoirement les usages de l'eau dans le Cantal. Mise à jour : au 24 novembre 2026, aucune restriction n'est en vigueur pour la commune."
  texte: |
    <p>La mairie relaie l'<strong>arrêté préfectoral n° 2026-199-DDT du 17 septembre 2026</strong> portant limitation provisoire des usages de l'eau dans le département du Cantal, applicable jusqu'au 31 octobre 2026 inclus. Les mesures dépendent de la zone de gestion et de l'origine de l'eau (réseau d'eau potable ou milieu naturel) : elles sont détaillées dans les annexes de l'arrêté.</p>
    <p>Cet arrêté a ensuite été remplacé par de nouveaux arrêtés préfectoraux, applicables eux aussi jusqu'au 31 octobre 2026.</p>
    <p><strong>Mise à jour :</strong> au 24 novembre 2026, aucune restriction des usages de l'eau n'est en vigueur pour la commune, d'après <a href="https://vigieau.gouv.fr/">vigieau.gouv.fr</a>, le site officiel de l'État.</p>
    <p><a href="https://regleau.s3.gra.perf.cloud.ovh.net/arrete-restriction/38116/52d3fc75-f2a4-49f6-b51e-659334755ae7/AP_Limitation_2026-09-17_signe.pdf">L'arrêté du 17 septembre 2026 (PDF de la préfecture, 23 pages)</a></p>

- date: "2026-09-11"
