  texte: |
    <p>À louer à partir du <strong>1<sup>er</sup> décembre</strong>, dans le bourg de Valette, un agréable <strong>T5</strong> avec une chambre et une salle de bain adaptées aux personnes à mobilité réduite (PMR).</p>
